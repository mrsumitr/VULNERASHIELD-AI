services:
  # ── Backend: FastAPI ───────────────────────────────────────────────────────
  - type: web
    name: vulnerashield-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://vulnerashield-frontend.onrender.com

  # ── Frontend: Next.js ──────────────────────────────────────────────────────
  - type: web
    name: vulnerashield-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://vulnerashield-backend.onrender.com
